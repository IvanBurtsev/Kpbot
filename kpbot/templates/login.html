{% extends "base.html" %}
{% block title %}Вход · kpbot{% endblock %}
{% block content %}
<section class="card narrow">
  <p><img src="/static/favicon.png" alt="КП" width="72" height="72" style="border-radius:12px"></p>
  <h1>Вход</h1>
  <p class="muted">Интерфейс показывает персональные данные из писем, поэтому закрыт паролем.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/ui/login" class="stack">
    <label>Логин (e-mail)
      <input type="email" name="email" autocomplete="username" placeholder="admin@local">
      <span class="muted small">{% if shared_login_allowed %}у администратора можно оставить пустым{% else %}для администратора: admin@local{% endif %}</span>
    </label>
    <label>Пароль
      <input type="password" name="password" autocomplete="current-password" required autofocus>
    </label>
    <button class="primary" type="submit">Войти</button>
  </form>
</section>
{% endblock %}
