<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}kpbot{% endblock %}</title>
  <link rel="icon" type="image/png" sizes="192x192" href="/static/favicon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
  <link rel="apple-touch-icon" href="/static/favicon.png">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/ui">kpbot <span class="muted">· заявка → КП</span></a>
  {% if authenticated %}
  <nav class="nav">
    <a href="/ui"{% if active_page == "inbox" %} class="active"{% endif %}>Заявки</a>
    <a href="/ui/prices"{% if active_page == "prices" %} class="active"{% endif %}>Прайс</a>
    {% if is_owner %}
    <a href="/ui/ops"{% if active_page == "ops" %} class="active"{% endif %}>Клиенты</a>
    {% endif %}
    {% if is_admin %}
    <a href="/ui/setup"{% if active_page == "setup" %} class="active"{% endif %}>Подключение</a>
    <a href="/ui/admin"{% if active_page == "admin" %} class="active"{% endif %}>Админка</a>
    {% endif %}
    {% if tenant_name %}<span class="badge">{{ tenant_name }}</span>{% endif %}
    <span class="muted small">{{ price_count }} позиций</span>
    <form method="post" action="/ui/logout" class="inline">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button class="link" type="submit">Выйти</button>
    </form>
  </nav>
  {% endif %}
</header>
<main class="wrap">
  {% block content %}{% endblock %}
</main>
<script src="/static/app.js" defer></script>
</body>
</html>
