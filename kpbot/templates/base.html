<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}kpbot{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/ui">kpbot <span class="muted">· заявка → КП</span></a>
  {% if authenticated %}
  <nav class="nav">
    <a href="/ui"{% if active_page == "inbox" %} class="active"{% endif %}>Заявки</a>
    <a href="/ui/prices"{% if active_page == "prices" %} class="active"{% endif %}>Прайс</a>
    {% if is_admin %}
    <a href="/ui/setup"{% if active_page == "setup" %} class="active"{% endif %}>Подключение</a>
    <a href="/ui/admin"{% if active_page == "admin" %} class="active"{% endif %}>Админка</a>
    {% endif %}
    <span class="muted small">{{ price_count }} позиций</span>
    <form method="post" action="/ui/logout" class="inline">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button class="link" type="submit">Выйти</button>
    </form>
  </nav>
  {% endif %}
</header>
<main class="wrap">
  {% block content %}{% endblock %}
</main>
<footer class="foot">
  {% if smtp_ready %}
  <span class="muted small">Письма отправляются с настроенного ящика</span>
  {% else %}
  <span class="muted small">Отправка писем не настроена</span>
  {% endif %}
</footer>
</body>
</html>
