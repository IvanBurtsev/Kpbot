# Секреты ищутся по всему репозиторию, кроме шаблонов и тестовых фикстур:
# в .env.example, документации и тестах намеренно стоят заглушки вида
# dev-api-key-change-me, sk-test-… и dummy-токены — иначе проверять
# редактирование логов и примеры настройки было бы невозможно.
title = "kpbot"

[extend]
useDefault = true

[allowlist]
description = "шаблоны конфигурации, примеры в документации и тестовые фикстуры"
paths = [
  '''\.env\.example''',
  '''^README\.md$''',
  '''^docs/''',
  '''^tests/''',
  '''\.gitleaks\.toml''',
]
# заглушки, которые не являются секретами
regexes = [
  '''dev-api-key-change-me''',
  '''dev-password''',
  '''dev-session-secret-change-me''',
]