# Секреты ищутся по всему репозиторию, кроме тестовых фикстур:
# в тестах намеренно используются «ключи» вида sk-test-… и dummy-токены,
# чтобы проверять редактирование логов.
title = "kpbot"

[extend]
useDefault = true

[allowlist]
description = "тестовые фикстуры с ненастоящими ключами"
paths = [
  '''tests/.*''',
  '''\.gitleaks\.toml''',
]