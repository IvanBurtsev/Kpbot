[project]
name = "kpbot"
version = "0.2.1"
description = "Заявка из письма → коммерческое предложение с расчётом, КП и 1С"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.9",
    "httpx>=0.27,<1",
    "openpyxl>=3.1,<4",
    "python-docx>=1.1,<2",
    "cryptography>=42,<51",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "pip-audit>=2.7"]

[tool.ruff]
target-version = "py312"
line-length = 110
exclude = [".tmp", "vendor", "1c-test", "data"]

[tool.ruff.lint]
# Пока только то, что ломает код: синтаксис, неопределённые имена, мёртвые f-string.
# Стилевые правила включим отдельным PR, когда база будет чистой.
select = ["E9", "F63", "F7", "F82"]
