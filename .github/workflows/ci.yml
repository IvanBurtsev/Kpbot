name: ci

on:
  push:
    branches: [main]
  pull_request:

# минимум прав: workflow только читает код
permissions:
  contents: read

jobs:
  tests:
    name: тесты
    runs-on: ubuntu-latest
    env:
      KPBOT_LLM_ENABLED: "false"
      KPBOT_PDF_ENABLED: "false"
      KPBOT_UI_PASSWORD: ci-password
      KPBOT_API_KEY: ci-api-key-1234567890abcdef
      KPBOT_SESSION_SECRET: ci-session-secret-1234567890abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: тесты
        run: python -m unittest discover -s tests -v

  secrets:
    name: проверка секретов
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # «прибит» к мажорной версии; для строгого режима заменить на commit SHA
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: аудит зависимостей
    runs-on: ubuntu-latest
    # информационный этап: уязвимость в зависимости не должна останавливать работу
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt