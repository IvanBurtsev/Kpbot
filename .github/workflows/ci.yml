name: ci

on:
  push:
    branches: [main]
  pull_request:

# минимум прав: workflow только читает код
permissions:
  contents: read

jobs:
  tests:
    name: тесты
    runs-on: ubuntu-latest
    env:
      KPBOT_LLM_ENABLED: "false"
      KPBOT_PDF_ENABLED: "false"
      KPBOT_UI_PASSWORD: ci-password
      KPBOT_API_KEY: not-a-secret-ci-value
      KPBOT_SESSION_SECRET: not-a-secret-ci-session
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: тесты
        run: python -m unittest discover -s tests -v

  secrets:
    name: проверка секретов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # официальный бинарник вместо action: у action бывают лицензионные сюрпризы
      - name: gitleaks
        run: |
          set -euo pipefail
          ARCHIVE=$(curl -sSf https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
            | grep -o 'https://[^"]*linux_x64.tar.gz' | head -1)
          echo "скачиваю: $ARCHIVE"
          curl -sSfL "$ARCHIVE" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
          ./gitleaks detect --source . --no-git --no-banner --redact --verbose

  audit:
    name: аудит зависимостей
    runs-on: ubuntu-latest
    # информационный этап: уязвимость в зависимости не должна останавливать работу
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt
